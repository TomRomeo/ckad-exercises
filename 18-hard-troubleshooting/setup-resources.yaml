apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deploy
  namespace: ckad-troubleshoot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:1.25
          command: ["nginx-wrong"]
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web-svc
  namespace: ckad-troubleshoot
spec:
  selector:
    app: web-wrong
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-conf
  namespace: ckad-troubleshoot
data:
  DB_HOST: mysql-svc
  DB_PORT: "3306"

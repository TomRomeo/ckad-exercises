apiVersion: v1
kind: Pod
metadata:
  name: web
  namespace: ckad-netpol
  labels:
    app: web
    tier: frontend
spec:
  containers:
    - name: nginx
      image: nginx:1.25
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: api
  namespace: ckad-netpol
  labels:
    app: api
    tier: backend
spec:
  containers:
    - name: nginx
      image: nginx:1.25
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: db
  namespace: ckad-netpol
  labels:
    app: db
    tier: database
spec:
  containers:
    - name: nginx
      image: nginx:1.25
      ports:
        - containerPort: 80

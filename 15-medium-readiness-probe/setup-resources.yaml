apiVersion: apps/v1
kind: Deployment
metadata:
  name: ready-app
  namespace: ckad-readiness
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ready-app
  template:
    metadata:
      labels:
        app: ready-app
    spec:
      containers:
        - name: nginx
          image: nginx:1.25
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ready-svc
  namespace: ckad-readiness
spec:
  selector:
    app: ready-app
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP

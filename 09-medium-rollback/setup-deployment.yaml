apiVersion: apps/v1
kind: Deployment
metadata:
  name: rollback-app
  namespace: ckad-rollback
  annotations:
    kubernetes.io/change-cause: "Initial deployment with nginx:1.23"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: rollback-app
  template:
    metadata:
      labels:
        app: rollback-app
    spec:
      containers:
      - name: nginx
        image: nginx:1.23
        ports:
        - containerPort: 80

apiVersion: v1
kind: Pod
metadata:
  name: frontend
  namespace: ckad-netpol-adv
  labels:
    app: frontend
    tier: web
spec:
  containers:
    - name: nginx
      image: nginx:1.25
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: backend
  namespace: ckad-netpol-adv
  labels:
    app: backend
    tier: api
spec:
  containers:
    - name: nginx
      image: nginx:1.25
      ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: database
  namespace: ckad-netpol-adv
  labels:
    app: database
    tier: data
spec:
  containers:
    - name: nginx
      image: nginx:1.25
      ports:
        - containerPort: 5432
---
apiVersion: v1
kind: Pod
metadata:
  name: monitoring
  namespace: ckad-netpol-external
  labels:
    app: monitoring
spec:
  containers:
    - name: busybox
      image: busybox:1.36
      command:
        - sleep
        - "3600"

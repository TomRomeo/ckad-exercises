apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ckad-svc-clusterip
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: nginx
          image: nginx:1.25
          ports:
            - containerPort: 80

apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: ckad-rolling-update
  annotations:
    kubernetes.io/change-cause: "Initial deployment with nginx:1.24"
spec:
  replicas: 4
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
      - name: nginx
        image: nginx:1.24
        ports:
        - containerPort: 80

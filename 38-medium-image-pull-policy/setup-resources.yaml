apiVersion: apps/v1
kind: Deployment
metadata:
  name: harvester
  namespace: ckad-pullpolicy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: harvester
  template:
    metadata:
      labels:
        app: harvester
    spec:
      containers:
        - name: app
          image: httpd:2-alpine
          ports:
            - containerPort: 80
        - name: sidecar
          image: busybox:1.36
          command: ["sh", "-c", "sleep 1d"]
